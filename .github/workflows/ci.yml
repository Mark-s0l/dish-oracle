name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: username
          POSTGRES_PASSWORD: xxxxx
          POSTGRES_DB: name_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - run: black --check .
      - run: isort --check .
      - run: flake8

      - run: pytest --cov --cov-report=term-missing
        env:
          DEBUG: "True"
          SECRET_KEY: spicy-secret-key-for-ci
          ALLOWED_HOSTS: 127.0.0.1,localhost
          DB_NAME: name_db
          DB_USER: username
          DB_PASSWORD: xxxxx
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          EMAIL_HOST: localhost
          EMAIL_PORT: 587
          EMAIL_USE_TLS: "True"
          EMAIL_HOST_USER: ci@example.com
          EMAIL_HOST_PASSWORD: spicy
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://127.0.0.1:6379/1
          EAN_DB_API_URL: https://ean-db.com/api/v2/product/
          EAN_DB_JWT: spice-jwt-for-ci

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.COVERALLS_REPO_TOKEN }}